[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-solver-workbench"
version = "0.1.3rc1"
description = "Open-source educational and research engineering solver workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "OpenSolver Workbench contributors" }
]
keywords = ["engineering", "solver", "workbench", "cae", "education", "research"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
mesh = ["meshio>=5.3", "gmsh>=4.12"]
viz = ["pyvista>=0.43", "matplotlib>=3.8"]
solvers = []
chm = ["cantera>=3.0", "CoolProp>=6.6"]
thermo = ["cantera>=3.0", "CoolProp>=6.6"]
mscript = ["scipy>=1.11", "hdf5storage>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "PySide6>=6.7",
  "meshio>=5.3",
  "gmsh>=4.12",
  "pyvista>=0.43",
  "matplotlib>=3.8",
  "cantera>=3.0",
  "CoolProp>=6.6",
  "scipy>=1.11",
  "hdf5storage>=0.1",
]

[project.scripts]
osw = "osw.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "external_solver: requires a local external solver or script executable and is excluded from local-safe CI by default",
  "optional_dependency: requires optional Python extras or optional local tools",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
