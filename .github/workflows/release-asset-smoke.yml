name: Release asset smoke

"on":
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to smoke
        default: v0.1.3-rc1
        required: true
      full_smoke:
        description: Run wheel/sdist/portable full smoke
        type: boolean
        default: false
      skip_portable_exe:
        description: Skip portable executable --help
        type: boolean
        default: true

permissions:
  contents: read

env:
  OSW_EXTERNAL_SOLVER_TESTS: "0"
  OSW_CI_LOCAL_SAFE: "1"

jobs:
  offline-release-asset-fixture-smoke:
    name: Offline release asset fixture smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit release asset smoke tests
        run: python -m pytest tests/unit/test_release_asset_smoke.py -q

      - name: Offline fixture asset smoke
        run: python tools/qa/check_release_asset_smoke.py --offline-asset-dir tests/fixtures/release_assets

  live-release-asset-download-smoke:
    name: Live release asset download smoke
    runs-on: windows-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Live GitHub release asset smoke
        shell: pwsh
        run: |
          $downloadDir = "artifacts/release/download_smoke/ci-${{ inputs.tag }}"
          $summaryPath = Join-Path $downloadDir "summary.json"
          $smokeArgs = @(
            "tools/qa/check_release_asset_smoke.py",
            "--repo", "CAPTW/OpenSourceWorkBench",
            "--tag", "${{ inputs.tag }}",
            "--download-dir", $downloadDir,
            "--download",
            "--json-out", $summaryPath
          )
          if ("${{ inputs.full_smoke }}" -eq "true") {
            $smokeArgs += "--full-smoke"
          }
          if ("${{ inputs.skip_portable_exe }}" -eq "true") {
            $smokeArgs += "--skip-portable-exe"
          }
          python @smokeArgs

      - name: Upload live smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-smoke-summary-${{ inputs.tag }}
          path: artifacts/release/download_smoke/ci-${{ inputs.tag }}/summary.json
          if-no-files-found: warn
